<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <input type="text" id="display" placeholder="0"><br><br>
        <div>
            <button type="submit"  class="button">AC</button>
            <button type="submit" class="button">00</button>
            <button type="submit" class="button" >%</button>
            <button type="submit" class="button" id="but" >&times;</button><br><br>
        </div>

        <div>
            <button type="submit"  class="button">7</button>
            <button type="submit" class="button">8</button>
            <button type="submit" class="button" >9</button>
            <button type="submit" class="button" id="but" >&minus;</button><br><br>
        </div>

        <div>
            <button type="submit"  class="button">4</button>
            <button type="submit" class="button">5</button>
            <button type="submit" class="button" >6</button>
            <button type="submit" class="button" id="but" >&plus;</button><br><br>
        </div>

        <div>
            <button type="submit"  class="button">1</button>
            <button type="submit" class="button">2</button>
            <button type="submit" class="button" >3</button>
            <button type="submit" class="button" id="but" >&divide;</button><br><br>
        </div>

         <div>
            <button type="submit"  class="button">&dot;</button>
            <button type="submit" class="button">0</button>
            <button type="submit" class="button" >/</button>
            <button type="submit" class="button" id="but">=</button><br><br>
        </div>

        



    </div>

    
</body>
</html>
